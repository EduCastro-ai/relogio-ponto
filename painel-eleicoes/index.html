<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Eleições 2026</title>
<style>
  @font-face { font-family:'Montserrat'; font-weight:400; font-style:normal; font-display:swap; src:url('dados/vendor/montserrat-5.1.0/montserrat-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family:'Montserrat'; font-weight:600; font-style:normal; font-display:swap; src:url('dados/vendor/montserrat-5.1.0/montserrat-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family:'Montserrat'; font-weight:700; font-style:normal; font-display:swap; src:url('dados/vendor/montserrat-5.1.0/montserrat-latin-700-normal.woff2') format('woff2'); }
  /* Identidade Portofino (tema do template corporativo): Montserrat; verdes 0A2824 / 0A413B / 158775 / 05C18B.
     O mapa mantém vermelho (Lula) e azul (Flávio): são cores de leitura do resultado, não de marca. */
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --mut:#5d6877; --line:#dde2e9;
    --lula:#c62828; --flavio:#1565c0; --acc:#0A413B; --acc-ink:#fff; --info:#158775; --hdr:#0A2824;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f141b; --card:#171e28; --ink:#e8edf3; --mut:#9aa6b5; --line:#2b3441; --acc:#158775; --acc-ink:#fff; --info:#3ABAA4; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:10px 16px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; background:var(--hdr); color:#fff; border-bottom:3px solid #05C18B; }
  header .logo { height:42px; width:auto; display:block; }
  header .titulo { display:flex; flex-direction:column; gap:2px; min-width:0; }
  header h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:.2px; }
  header small { color:#ABC997; font-size:11px; }
  main { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr); gap:12px; padding:12px 16px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
  .controls { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .controls button, .tabs button, select { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  .controls button[aria-pressed="true"], .tabs button[aria-pressed="true"] { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); }
  #map { width:100%; height:auto; aspect-ratio:4/3; max-height:80vh; display:block; background:transparent; touch-action:none; }
  #mapbox { position:relative; }
  #mapbox canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #map path { stroke:rgba(0,0,0,.18); stroke-width:.3; vector-effect:non-scaling-stroke; }
  #map path.sel { stroke:#000; stroke-width:1.6; }
  .legend { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mut); margin-top:6px; flex-wrap:wrap; }
  .legend .escala { position:relative; display:inline-block; width:200px; padding-bottom:15px; }
  .legend .escala .bar { display:block; width:100%; height:10px; border-radius:5px; }
  .legend .marcas span { position:absolute; top:12px; transform:translateX(-50%); font-size:11px; }
  .legend .aviso-escala { line-height:1.4; }
  .controls label { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--mut); cursor:pointer; }
  .controls .grupo { display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .controls .grupo .gl { font-size:12px; color:var(--mut); }
  .controls .grupo button { padding:4px 8px; font-size:12px; }
  .controls .minseta input { width:90px; accent-color:var(--acc); }
  .controls .minseta output { min-width:24px; text-align:right; }
  #ajuda { position:fixed; pointer-events:none; display:none; z-index:10; max-width:330px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.45; white-space:pre-line; box-shadow:0 4px 14px rgba(0,0,0,.2); text-align:left; font-weight:400; }
  th[data-info]::after, td[data-info]::after, span[data-info]::after, h3[data-info]::after { content:' ⓘ'; color:var(--info); font-size:1.15em; font-weight:700; }
  .kpi[data-info] { position:relative; padding-right:24px; }
  .kpi[data-info]::after { content:'ⓘ'; position:absolute; top:5px; right:7px; color:var(--info); font-size:15px; font-weight:700; }
  .legend .i { cursor:help; color:var(--info); font-size:15px; font-weight:700; }
  .legend .i::after { content:none; }
  [data-info] { cursor:help; }
  button[data-info]::after { content:none; }
  #tip { position:fixed; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); display:none; z-index:5; max-width:260px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--mut); font-weight:600; cursor:pointer; position:sticky; top:0; background:var(--card); }
  tbody tr:hover { background:rgba(128,128,128,.12); cursor:pointer; }
  .scroll { max-height:56vh; overflow:auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:10px; }
  .kpi { border:1px solid var(--line); border-radius:8px; padding:8px; }
  .kpi b { display:block; font-size:18px; }
  .kpi span { color:var(--mut); font-size:12px; }
  .L { color:var(--lula); } .F { color:var(--flavio); }
  .stack { display:flex; height:22px; border-radius:5px; overflow:hidden; margin:4px 0 2px; }
  .stack div { height:100%; }
  .note { font-size:12px; color:var(--mut); margin-top:8px; }
  .warn { border-left:3px solid #e0a000; padding:6px 10px; background:rgba(224,160,0,.1); border-radius:4px; font-size:12px; margin-top:10px; }
  h3 { margin:12px 0 4px; font-size:14px; }
  input[type=search] { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 8px; width:100%; margin-bottom:6px; }
  footer { padding:6px 16px 18px; color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>
  <img class="logo" src="assets/portofino-logo-branco.png" alt="Portofino Multi Family Office">
  <div class="titulo">
    <h1>Eleições 2026 · Presidente · 1º × 2º turno</h1>
    <small id="fonte"></small>
  </div>
</header>
<main>
  <section class="card">
    <div class="controls" id="modos" role="group" aria-label="Camada do mapa"></div>
    <div id="mapbox"><svg id="map" role="img" aria-label="Mapa dos municípios do Brasil"></svg><canvas id="locais" aria-hidden="true"></canvas><canvas id="setas" aria-hidden="true"></canvas></div>
    <div class="legend" id="legenda"></div>
  </section>
  <aside class="card">
    <div class="tabs" id="abas" role="group" aria-label="Seções"></div>
    <div id="painel"></div>
  </aside>
</main>
<footer id="rodape"></footer>
<div id="tip"></div>
<div id="ajuda" role="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="dados/painel.js"></script>
<script src="dados/malha.js"></script>
<script>if (location.search.includes('locais')) document.write('<script src="dados/locais.js"><\/script>'); // camada de locais de votação: opcional (?locais=1), 11 MB</script>
<script>
(() => {
  const P = window.PAINEL, G = window.MALHA, LC = window.LOCAIS;
  const M = P.municipios, porIbge = new Map(M.filter(m => m.ibge).map(m => [m.ibge, m]));
  const fmt = n => Math.round(n).toLocaleString('pt-BR');
  const mi = n => (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi';
  const pp = (n, d = 1) => (n > 0 ? '+' : '') + n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' p.p.';
  const pc = (n, d = 1) => n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const lado = m => m > 0 ? 'Lula' : m < 0 ? 'Flávio' : 'Empate';
  const sum = (arr, k) => arr.reduce((s, x) => s + x[k], 0);

  // Textos de ajuda (ícone ⓘ): explicam o cálculo ao passar o mouse
  const AJUDA = {
    m2: 'Margem do 2º turno = % de Lula − % de Flávio, sobre os votos válidos do município no 2º turno.\nEx.: Lula 60% e Flávio 40% → +20 p.p.\nPositivo = Lula na frente; negativo = Flávio na frente.',
    m1: 'Margem do 1º turno = % de Lula − % de Flávio, sobre todos os votos válidos do 1º turno. Essa base inclui os outros candidatos, por isso Lula e Flávio somam menos de 100%.',
    m12: 'Margem = % de Lula − % de Flávio sobre os votos válidos de cada turno (p.p.). Positivo = Lula na frente. A seta mostra o 1º → 2º turno.',
    swing: 'Swing = margem do 2º turno − margem do 1º turno (p.p.). É a medida convencional e aparece como apoio nas tabelas e quadros; a medida principal do painel é o Δ fatia.\nPositivo = a margem se deslocou a favor de Lula, mesmo que Flávio ainda esteja na frente.\nInclui um efeito mecânico: os votos dos outros candidatos do 1º turno saem da base e ampliam a vantagem que já existia.',
    fatia: 'Δ fatia (medida principal do deslocamento) = Lula ÷ (Lula + Flávio) no 2º turno − o mesmo no 1º turno (p.p.).\nPositivo = o resultado se deslocou a favor de Lula; negativo = a favor de Flávio.\nIgnora os outros candidatos nos dois turnos, por isso remove o efeito mecânico do swing. Dobrando o valor, ele fica na mesma escala do swing.',
    faixas: 'Divide os municípios do recorte em três grupos pelo Δ fatia e pelo mínimo escolhido no controle "mín.":\npró-Lula (Δ fatia ≥ mínimo), pró-Flávio (Δ fatia ≤ −mínimo) e estável (entre os dois).\nA 1ª barra conta municípios; a 2ª pesa pelos votos válidos do 2º turno. Municípios grandes pesam mais na 2ª barra.',
    pmun: '% mun. pró-Lula = % dos municípios do recorte em que o Δ fatia favorece Lula em pelo menos o mínimo escolhido no controle "mín." das setas.',
    pvot: '% votos = parcela dos votos válidos do 2º turno que esses municípios representam. É diferente da % de municípios, porque os grandes pesam mais.',
    part: 'Δ comparecimento = (comparecimento do 2º turno − comparecimento do 1º turno) ÷ eleitores aptos, em p.p.',
    virada: 'Virada = município em que o mais votado entre Lula e Flávio mudou do 1º para o 2º turno. Compara só os dois; empate não conta.',
    dLula: 'Δ Lula = votos de Lula no 2º turno − votos no 1º turno. É ganho líquido, não migração: o voto é secreto.',
    dFlavio: 'Δ Flávio = votos de Flávio no 2º turno − votos no 1º turno. É ganho líquido, não migração: o voto é secreto.',
    dPart: 'Δ comp. = variação do comparecimento entre os turnos, em p.p. dos eleitores aptos.',
    munpos: 'Conta só municípios com votos nos dois turnos. Δ fatia positivo = Lula ÷ (Lula + Flávio) maior no 2º turno que no 1º. A medida convencional (swing da margem) inclui o efeito mecânico dos outros candidatos do 1º turno.',
    validos: 'Válidos 2º t. = votos válidos do 2º turno: votos em Lula ou em Flávio (sem brancos, nulos e abstenções). Indica o tamanho do município.',
    abst: 'Abstenção = eleitores aptos que não compareceram ÷ eleitores aptos. A seta mostra o 1º → 2º turno.',
    outros: 'Votos válidos dos outros candidatos no 1º turno. Eles não disputaram o 2º turno; esses eleitores só aparecem no 2º se votaram em Lula ou Flávio, em branco/nulo, ou se abstiveram.',
    compMais: 'Comparecimento do 2º turno − comparecimento do 1º turno (eleitores que compareceram a mais).',
    bnMais: 'Brancos e nulos do 1º turno − brancos e nulos do 2º turno: quem votou em branco/nulo no 1º e passou a votar em candidato. Valor negativo = mais brancos/nulos no 2º.',
    setas: 'Setas de deslocamento: ← vermelha = o município se deslocou a favor de Lula; → azul = a favor de Flávio.\nUsam o Δ fatia (Lula ÷ (Lula + Flávio), 2º − 1º turno) e só aparecem quando o deslocamento é de pelo menos o mínimo escolhido. O tamanho da seta é proporcional ao valor. Ela fica no centro do município e não diz quem ganhou, só para onde o resultado se moveu.',
    pesoVal: '% válidos = parcela dos votos válidos do 2º turno do recorte (região/estado escolhido) que o grupo representa.',
    totalDec: 'Votos válidos a mais = (outros candidatos do 1º turno) + (comparecimento a mais) + (brancos/nulos que passaram a votar). É uma conta de saldo, não um mapa de migração.',
  };
  const ai = k => `data-info="${esc(AJUDA[k])}"`;

  // Δ da fatia de Lula entre os finalistas: Lula ÷ (Lula + Flávio) no 2º turno − o mesmo no 1º turno (p.p.). Remove o efeito mecânico de os "outros" sumirem
  M.forEach(m => { const a = m.L1 + m.F1, b = m.L2 + m.F2; m.ok = m.val1 > 0 && m.val2 > 0 && a > 0 && b > 0; m.dsh = m.ok ? (m.L2 / b - m.L1 / a) * 100 : 0; });
  const REGIAO_DE = Object.fromEntries(P.ufs.map(u => [u.k, u.regiao]));
  // Filtros por atributo do município: capital (código IBGE das 27 capitais) e tamanho (eleitores aptos). O exterior fica fora dos dois
  const CAPITAIS = new Set(['1200401','2704302','1600303','1302603','2927408','2304400','5300108','3205309','5208707','2111300','5103403','5002704','3106200','1501402','2507507','4106902','2611606','2211001','3304557','2408102','4314902','1100205','1400100','4205407','3550308','2800308','1721000']);
  const FAIXAS = [['f1', 'Até 10 mil eleitores', 1e4], ['f2', '10 a 50 mil', 5e4], ['f3', '50 a 200 mil', 2e5], ['f4', 'Mais de 200 mil', Infinity]];
  M.forEach(m => { m.capital = CAPITAIS.has(String(m.ibge)); m.faixa = m.uf === 'zz' ? null : FAIXAS.find(f => m.aptos <= f[2])[0]; });
  // Quantos municípios (e quanto do eleitorado válido) deslocaram o resultado a favor de Lula
  function estatSwing(ms) {
    const ok = ms.filter(m => m.ok), tv = sum(ok, 'val2');
    const f = g => { const p = ok.filter(g); return { n: p.length, pn: ok.length ? p.length / ok.length * 100 : 0, pv: tv ? sum(p, 'val2') / tv * 100 : 0 }; };
    return { total: ok.length, marg: f(m => m.swing > 0), fatia: f(m => m.dsh > 0) };
  }
  // Faixas de deslocamento pelo Δ fatia e pelo mínimo das setas: quantos municípios (e que parcela dos votos válidos) são pró-Lula, pró-Flávio ou estáveis
  function estatMin(ms, min) {
    let n = 0, tv = 0, nl = 0, nf = 0, vl = 0, vf = 0;
    for (const m of ms) {
      if (!m.ok) continue; n++; tv += m.val2;
      if (m.dsh > 0 && m.dsh >= min) { nl++; vl += m.val2; } else if (m.dsh < 0 && m.dsh <= -min) { nf++; vf += m.val2; }
    }
    const p = (a, b) => (b ? a / b * 100 : 0);
    return { n, tv, nl, nf, ne: n - nl - nf, vl, vf, ve: tv - vl - vf, pl: p(nl, n), pf: p(nf, n), pe: p(n - nl - nf, n), vlp: p(vl, tv), vfp: p(vf, tv), vep: p(tv - vl - vf, tv) };
  }

  document.getElementById('fonte').textContent = `Fonte: TSE (portal de resultados). 1º turno ${P.meta.atualizado.t1} · 2º turno ${P.meta.atualizado.t2} (horário local, dado do portal). Conferir sempre no TSE.`;
  document.getElementById('rodape').textContent = `Dados gerados em ${new Date(P.meta.geradoEm).toLocaleString('pt-BR')}. Soma dos municípios confere com os totais do portal do TSE: ${P.meta.conferenciaOk ? 'sim' : 'NÃO'}. O exterior (186 localidades) entra nos totais e nas tabelas, mas não no mapa. Boa Esperança do Norte/MT não tem polígono na malha do IBGE usada.`;

  // ---------- Camadas do mapa ----------
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const rdbu = (v, lim) => d3.interpolateRdBu(clamp((lim - v) / (2 * lim))); // positivo (Lula) = vermelho; negativo (Flávio) = azul
  const dPart = m => (m.comp2 - m.comp1) / m.aptos * 100;
  // Escala de cores: limites fixos (comparáveis entre recortes) ou ajustados ao recorte atual (percentil 98 dos municípios)
  const LIM = { m2: [-60, 60], m1: [-60, 60], swing: [-20, 20], fatia: [-10, 10], part: [-2, 10] };
  const valorModo = { m2: m => m.m2, m1: m => m.m1, swing: m => m.swing, fatia: m => m.dsh, part: dPart };
  let escalaAuto = false, limAuto = {};
  const lims = k => (escalaAuto && limAuto[k]) || LIM[k];
  function calcEscala() {
    limAuto = {};
    const ms = M.filter(m => m.ok && m.uf !== 'zz' && noEscopo(m)); if (!ms.length) return; // o exterior não aparece no mapa
    const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor(arr.length * p)))];
    for (const k of ['m2', 'm1', 'fatia']) {
      const a = ms.map(m => Math.abs(valorModo[k](m))).sort((x, y) => x - y), passo = k === 'fatia' ? 1 : 5;
      const l = Math.max(passo, Math.ceil(pct(a, .98) / passo) * passo); limAuto[k] = [-l, l];
    }
    const v = ms.map(dPart).sort((x, y) => x - y), lo = Math.floor(pct(v, .02)), hi = Math.max(lo + 1, Math.ceil(pct(v, .98)));
    limAuto.part = [lo, hi];
  }
  // extremos reais do recorte (só municípios com ≥ 2 mil válidos, para não destacar cidades minúsculas)
  function infoEscala() {
    const f = valorModo[modo]; if (!f) return '';
    const [lo, hi] = lims(modo), ms = M.filter(m => m.ok && m.uf !== 'zz' && m.val2 >= 2000 && noEscopo(m)); if (!ms.length) return '';
    let mx = ms[0], mn = ms[0]; ms.forEach(m => { if (f(m) > f(mx)) mx = m; if (f(m) < f(mn)) mn = m; });
    const fora = ms.filter(m => f(m) < lo || f(m) > hi).length, nm = m => `${esc(m.nome)}/${m.uf.toUpperCase()}`;
    return `Extremos no recorte (municípios com ≥ 2 mil válidos): maior ${pp(f(mx))} em ${nm(mx)}; menor ${pp(f(mn))} em ${nm(mn)}. ${fora ? `${fora} de ${ms.length} municípios (${pc(fora / ms.length * 100, 0)}) ${fora === 1 ? 'passa' : 'passam'} dos limites da escala e ${fora === 1 ? 'aparece' : 'aparecem'} na cor máxima.` : 'Nenhum município passa dos limites da escala.'}`;
  }
  const modos = {
    m2: { nome: 'Margem 2º turno', cor: m => rdbu(m.m2, lims('m2')[1]), get leg() { return [...lims('m2'), 'Flávio', 'Lula', 'p.p. de margem (Lula − Flávio, % dos válidos)']; }, tip: m => `Margem: ${lado(m.m2)} ${pp(Math.abs(m.m2))}` },
    m1: { nome: 'Margem 1º turno', cor: m => rdbu(m.m1, lims('m1')[1]), get leg() { return [...lims('m1'), 'Flávio', 'Lula', 'p.p. de margem (Lula − Flávio, % dos válidos)']; }, tip: m => `Margem 1º t.: ${lado(m.m1)} ${pp(Math.abs(m.m1))}` },
    fatia: { nome: 'Deslocamento (Δ fatia)', cor: m => rdbu(m.dsh, lims('fatia')[1]), get leg() { return [...lims('fatia'), 'Flávio', 'Lula', 'Δ da fatia de Lula entre os finalistas, p.p. (Lula ÷ (Lula + Flávio), 1º → 2º turno)']; }, tip: m => `Δ fatia de Lula: ${pp(m.dsh)}` },
    virada: { nome: 'Viradas', cor: m => m.virada === 'F>L' ? '#b71c1c' : m.virada === 'L>F' ? '#0d47a1' : (m.v2 === 'L' ? '#f3d2d2' : '#d0e0f3'), leg: null, tip: m => m.virada === 'F>L' ? 'VIROU: Flávio → Lula' : m.virada === 'L>F' ? 'VIROU: Lula → Flávio' : 'Manteve o líder' },
    part: { nome: 'Comparecimento Δ', cor: m => { const [lo, hi] = lims('part'); return d3.interpolateGreens(clamp((dPart(m) - lo) / (hi - lo))); }, get leg() { const [lo, hi] = lims('part'); return [lo, hi, 'menos', 'mais', 'variação do comparecimento, p.p. do eleitorado apto']; }, tip: m => `Comparecimento: ${pp(dPart(m))}` },
  };
  let modo = 'm2', selecionado = null, ufSel = null, regSel = null, capSel = '', tamSel = '', setas = 'nenhuma', minSeta = 3;

  const svg = d3.select('#map'), gMapa = svg.append('g');
  const box = svg.node().getBoundingClientRect();
  // Mercator plana (sem geometria esférica): a malha do IBGE tem anéis com orientação mista, que o d3 esférico leria como "o globo menos o polígono"
  const merc = (lon, lat) => [lon * Math.PI / 180, -Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];

    tip.style.display = 'block'; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 270) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
    tip.innerHTML = `<b>${esc(r[6])}</b><br>${esc(m ? m.nome : '')}/${r[0]} · zona ${r[2]}<br>1º t.: ${txtMg(tn(r, 1))}${temT2 ? `<br>2º t.: ${txtMg(tn(r, 2))}` : ''}`;
  });
  svg.on('click.loc', ev => { const i = localPerto(ev); if (i >= 0) selecionarLocal(i); });
  function selecionarLocal(i) {
    selLocal = i; const m = munDe(LC.linhas[i]); if (m) selecionado = m; aba = 'local'; render(); pintar();
    const t = d3.zoomTransform(svg.node()), k = Math.max(t.k, 10);
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-xs[i], -ys[i]));
  }
  function zoomIndices(ids) {
    const v = ids.filter(i => LC.linhas[i][4] != null); if (!v.length) return;
    const X = v.map(i => xs[i]), Y = v.map(i => ys[i]); zoomCaixa(Math.min(...X), Math.min(...Y), Math.max(...X), Math.max(...Y), 40);
  }

  // ---------- Painel lateral ----------
  const abas = { brasil: 'Brasil', estado: 'Recorte', regioes: 'Regiões e UFs', recortes: 'Capitais e tamanho', ranking: 'Rankings', mun: 'Município', ...(LC ? { bairros: 'Bairros', local: 'Local' } : {}) };
  let aba = 'brasil', rank = 'viradas', ordUF = 'dfatia', ordDir = -1, busca = '';
  const ab = document.getElementById('abas'), pn = document.getElementById('painel');
  Object.entries(abas).forEach(([k, v]) => { const b = document.createElement('button'); b.textContent = v; b.dataset.k = k; b.onclick = () => { aba = k; render(); }; ab.appendChild(b); });

  function decomp(x) { // x: {L1,F1,L2,F2,O1,comp1,comp2,bn1,bn2}
    const dL = x.L2 - x.L1, dF = x.F2 - x.F1, tot = dL + dF;
    return { dL, dF, tot, outros: x.O1, comp: x.comp2 - x.comp1, bn: x.bn1 - x.bn2 };
  }
  function blocoDecomp(x) {
    const d = decomp(x), pL = d.tot ? d.dL / d.tot * 100 : 0;
    return `<h3>De onde vieram os votos a mais (válidos)</h3>
    <div class="kpis">
      <div class="kpi" ${ai('totalDec')}><b>${fmt(d.tot)}</b><span>votos válidos a mais</span></div>
      <div class="kpi"><b class="L">${fmt(d.dL)}</b><span>Lula (${pc(pL)})</span></div>
      <div class="kpi"><b class="F">${fmt(d.dF)}</b><span>Flávio (${pc(100 - pL)})</span></div>
    </div>
    <table><tbody>
      <tr><td ${ai('outros')}>Eleitores de outros candidatos no 1º turno</td><td>${fmt(d.outros)}</td></tr>
      <tr><td ${ai('compMais')}>Comparecimento a mais</td><td>${fmt(d.comp)}</td></tr>
      <tr><td ${ai('bnMais')}>Brancos e nulos que passaram a votar</td><td>${fmt(d.bn)}</td></tr>
      <tr><td ${ai('totalDec')}><b>Total</b></td><td><b>${fmt(d.outros + d.comp + d.bn)}</b></td></tr>
    </tbody></table>
    <div class="note">Conta de saldo entre os turnos. O voto é secreto: não dá para saber quem votou em quem (risco de falácia ecológica). Parcelas negativas indicam queda.</div>`;
  }
  function kpiSwing(ms) {
    const e = estatSwing(ms); if (!e.total) return '';
    return `<div class="kpi" style="grid-column:1/-1" ${ai('munpos')}><b>${pc(e.fatia.pn, 0)} dos municípios <small>(${fmt(e.fatia.n)} de ${fmt(e.total)})</small></b><span>deslocaram o resultado a favor de Lula (Δ fatia positivo) e concentram ${pc(e.fatia.pv, 1)} dos votos válidos. Pela medida convencional (swing da margem): ${fmt(e.marg.n)} municípios (${pc(e.marg.pn, 0)}), ${pc(e.marg.pv, 1)} dos votos válidos. Só municípios com votos nos dois turnos.</span></div>`;
  }
  // Barras de faixas (pró-Lula / estável / pró-Flávio) em % dos municípios e em % dos votos válidos, pelo mínimo das setas
  function blocoFaixas(ms) {
    const e = estatMin(ms, minSeta); if (!e.n) return '';
    const barra = (l, s, f) => `<div class="stack"><div style="width:${l}%;background:var(--lula)"></div><div style="width:${s}%;background:#c5cbd3"></div><div style="width:${f}%;background:var(--flavio)"></div></div>`;
    const txt = (l, s, f) => `<span class="L">← pró-Lula ${pc(l, 1)}</span> · estável ${pc(s, 1)} · <span class="F">pró-Flávio ${pc(f, 1)} →</span>`;
    return `<h3 ${ai('faixas')}>Deslocamento do resultado <small>(Δ fatia de pelo menos ${minSeta.toLocaleString('pt-BR', { minimumFractionDigits: 1 })} p.p.)</small></h3>
    <div class="note" style="margin-top:0">Municípios (${fmt(e.nl)} pró-Lula, ${fmt(e.ne)} estáveis, ${fmt(e.nf)} pró-Flávio, de ${fmt(e.n)})</div>${barra(e.pl, e.pe, e.pf)}<div class="note" style="margin-top:2px">${txt(e.pl, e.pe, e.pf)}</div>
    <div class="note">Votos válidos do 2º turno que esses municípios representam</div>${barra(e.vlp, e.vep, e.vfp)}<div class="note" style="margin-top:2px">${txt(e.vlp, e.vep, e.vfp)}</div>
    <div class="note">O mínimo é o mesmo do controle "mín." das setas.</div>`;
  }
  // Barras dos votos válidos em cada turno: mostram como a divisão mudou (no 1º turno entram os outros candidatos)
  function blocoTurnos(t) {
    return `<h3>Votos válidos em cada turno</h3>
    <div class="stack"><div style="width:${t.L1 / t.val1 * 100}%;background:var(--lula)"></div><div style="width:${t.O1 / t.val1 * 100}%;background:#9aa6b5"></div><div style="width:${t.F1 / t.val1 * 100}%;background:var(--flavio)"></div></div>
    <div class="note">1º turno: Lula ${pc(t.L1 / t.val1 * 100, 2)} · outros ${pc(t.O1 / t.val1 * 100, 2)} · Flávio ${pc(t.F1 / t.val1 * 100, 2)}</div>
    <div class="stack"><div style="width:${t.L2 / t.val2 * 100}%;background:var(--lula)"></div><div style="width:${t.F2 / t.val2 * 100}%;background:var(--flavio)"></div></div>
    <div class="note">2º turno: Lula ${pc(t.L2 / t.val2 * 100, 2)} · Flávio ${pc(t.F2 / t.val2 * 100, 2)}</div>
    `;
  }
  const tot = (arr) => { const o = {}; ['aptos','comp1','comp2','val1','val2','bn1','bn2','L1','F1','O1','L2','F2'].forEach(k => o[k] = sum(arr, k)); o.m1 = (o.L1 - o.F1) / o.val1 * 100; o.m2 = (o.L2 - o.F2) / o.val2 * 100; o.swing = o.m2 - o.m1; o.dfatia = (o.L2 / (o.L2 + o.F2) - o.L1 / (o.L1 + o.F1)) * 100; return o; };

  function viewBrasil() {
    const t = tot(M), v = M.filter(m => m.virada);
    return `<div class="kpis">
      <div class="kpi"><b class="L">${pc(t.L2 / t.val2 * 100, 2)}</b><span>Lula 2º t. (${mi(t.L2)})</span></div>
      <div class="kpi"><b class="F">${pc(t.F2 / t.val2 * 100, 2)}</b><span>Flávio 2º t. (${mi(t.F2)})</span></div>
      <div class="kpi" ${ai('fatia')}><b>${pp(t.dfatia, 2)}</b><span>Δ fatia de Lula (swing da margem: ${pp(t.swing, 2)})</span></div>
      <div class="kpi" ${ai('virada')}><b>${v.length}</b><span>municípios viraram (${v.filter(x => x.virada === 'F>L').length} p/ Lula, ${v.filter(x => x.virada === 'L>F').length} p/ Flávio)</span></div>
      <div class="kpi" ${ai('abst')}><b>${pc((1 - t.comp1 / t.aptos) * 100,2)} → ${pc((1 - t.comp2 / t.aptos) * 100, 2)}</b><span>abstenção</span></div>
      ${kpiSwing(M)}
    </div>
    ${blocoTurnos(t)}
    ${blocoFaixas(M.filter(m => m.uf !== 'zz'))}
    ${blocoDecomp(t)}`;
  }

  function tabelaGrupo(rows, titulo, clicavel) {
    const cols = [['k', titulo], ['dfatia', 'Δ fatia', 'fatia'], ['swing', 'Swing', 'swing'], ['pml', '% mun. pró-Lula', 'pmun'], ['pvl', '% votos', 'pvot'], ['m2', 'Margem 2º', 'm2'], ['dL', 'Δ Lula', 'dLula'], ['dF', 'Δ Flávio', 'dFlavio'], ['dPart', 'Δ comp. pp', 'dPart'], ['viradas', 'Viradas', 'virada']];
    const r = rows.map(g => {
      const ms = g.regiao !== undefined ? M.filter(m => m.uf === g.k) : M.filter(m => m.regiao === g.k), e = estatMin(ms, minSeta); // linha de UF tem "regiao"; linha de região, não
      return { ...g, dL: g.L2 - g.L1, dF: g.F2 - g.F1, dPart: (g.comp2 - g.comp1) / g.aptos * 100, dfatia: (g.L2 / (g.L2 + g.F2) - g.L1 / (g.L1 + g.F1)) * 100, pml: e.pl, pvl: e.vlp };
    });
    r.sort((a, b) => ordDir * ((typeof a[ordUF] === 'string') ? a[ordUF].localeCompare(b[ordUF]) : a[ordUF] - b[ordUF]));
    return `<table><thead><tr>${cols.map(c => `<th data-o="${c[0]}" ${c[2] ? ai(c[2]) : ''}>${c[1]}${ordUF === c[0] ? (ordDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
      ${r.map(g => `<tr ${clicavel && g.k !== 'Exterior' ? `data-${clicavel}="${g.k}"` : ''}><td>${esc(g.k.length === 2 ? g.k.toUpperCase() : g.k)}</td><td>${pp(g.dfatia)}</td><td>${pp(g.swing)}</td><td>${pc(g.pml, 0)}</td><td>${pc(g.pvl, 0)}</td><td class="${g.m2 > 0 ? 'L' : 'F'}">${pp(g.m2)}</td><td>${fmt(g.dL)}</td><td>${fmt(g.dF)}</td><td>${pp(g.dPart)}</td><td>${g.viradas ?? ''}</td></tr>`).join('')}</tbody></table>`;
  }
  function viewRegioes() { return `<h3>Regiões <small>(clique para analisar)</small></h3>${tabelaGrupo(P.regioes, 'Região', 'reg')}<h3>UFs <small>(clique para analisar)</small></h3><div class="scroll">${tabelaGrupo(P.ufs, 'UF', 'uf')}</div><div class="note">Δ fatia = deslocamento de Lula ÷ (Lula + Flávio) entre os turnos (medida principal); swing e margem em p.p. de (Lula − Flávio) sobre os votos válidos. Δ Lula e Δ Flávio = 2º turno − 1º turno. "% mun. pró-Lula" e "% votos" usam o mínimo do controle "mín." das setas (hoje ${minSeta.toLocaleString('pt-BR', { minimumFractionDigits: 1 })} p.p.).</div>`; }

  // Comparação por grupo (capitais × interior e faixas de tamanho), dentro da região/estado escolhido; clicar em uma linha aplica o filtro
  function viewRecortes() {
    const geo = M.filter(m => noGeo(m) && m.uf !== 'zz');
    const linha = (rot, ms, attr) => {
      if (!ms.length) return ''; const t = tot(ms), e = estatMin(ms, minSeta), ativo = attr && (attr[0] === 'cap' ? capSel === attr[1] : tamSel === attr[1]);
      return `<tr ${attr ? `data-${attr[0]}="${attr[1]}"` : ''} ${ativo ? 'style="font-weight:700"' : ''}><td>${rot}</td><td>${fmt(ms.length)}</td><td>${pc(t.val2 / sum(geo, 'val2') * 100, 1)}</td><td>${pp(t.dfatia)}</td><td>${pp(t.swing)}</td><td>${pc(e.pl, 0)}</td><td>${pc(e.vlp, 0)}</td><td class="${t.m2 > 0 ? 'L' : 'F'}">${pp(t.m2)}</td><td>${ms.filter(m => m.virada).length}</td></tr>`;
    };
    const cab = t => `<thead><tr><th>${t}</th><th>Municípios</th><th ${ai('pesoVal')}>% válidos</th><th ${ai('fatia')}>Δ fatia</th><th ${ai('swing')}>Swing</th><th ${ai('pmun')}>% mun. pró-Lula</th><th ${ai('pvot')}>% votos</th><th ${ai('m2')}>Margem 2º</th><th ${ai('virada')}>Viradas</th></tr></thead>`;
    const esc0 = ufSel ? (UFNOME[ufSel] ?? ufSel) : regSel ? `Região ${regSel}` : 'Brasil (sem exterior)';
    return `<h3 style="margin-top:0">Capitais × interior <small>(${esc(esc0)}; clique para filtrar)</small></h3>
    <table>${cab('Grupo')}<tbody>${linha('Capitais', geo.filter(m => m.capital), ['cap', 'capitais'])}${linha('Demais municípios', geo.filter(m => !m.capital), ['cap', 'interior'])}</tbody></table>
    <h3>Por tamanho do município <small>(eleitores aptos)</small></h3>
    <table>${cab('Faixa')}<tbody>${FAIXAS.map(f => linha(f[1], geo.filter(m => m.faixa === f[0]), ['tam', f[0]])).join('')}</tbody></table>
    <div class="note">Os grupos dividem os municípios do recorte geográfico escolhido (região ou estado). "% válidos" = parcela dos votos válidos do 2º turno do recorte. Δ fatia, swing e margem são calculados somando os votos do grupo. "% mun. pró-Lula" e "% votos" usam o mínimo do controle "mín." das setas (hoje ${minSeta.toLocaleString('pt-BR', { minimumFractionDigits: 1 })} p.p.). Tamanho = eleitores aptos do município, dado do TSE. São características do município, não de cada eleitor: o voto é secreto e o painel não mostra como cada tipo de eleitor votou.</div>`;
  }

  const rankings = {
    viradas: ['Viradas (por votos válidos)', () => M.filter(m => m.virada).sort((a, b) => b.val2 - a.val2)],
    apertadas: ['Mais apertadas no 2º turno (≥ 10 mil válidos)', () => M.filter(m => m.val2 >= 10000).sort((a, b) => Math.abs(a.m2) - Math.abs(b.m2))],
    fatiaL: ['Maior deslocamento pró-Lula, Δ fatia (≥ 10 mil válidos)', () => M.filter(m => m.ok && m.val2 >= 10000).sort((a, b) => b.dsh - a.dsh)],
    fatiaF: ['Maior deslocamento pró-Flávio, Δ fatia (≥ 10 mil válidos)', () => M.filter(m => m.ok && m.val2 >= 10000).sort((a, b) => a.dsh - b.dsh)],
    capitais: ['Maiores municípios (por votos válidos)', () => [...M].sort((a, b) => b.val2 - a.val2)],
  };
  function viewRanking() {
    const lista = rankings[rank][1]().filter(m => !busca || (m.nome + ' ' + m.uf).toLowerCase().includes(busca.toLowerCase())).slice(0, 80);
    return `<select id="selRank">${Object.entries(rankings).map(([k, v]) => `<option value="${k}" ${k === rank ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
    <input type="search" id="busca" placeholder="Filtrar por nome ou UF…" value="${esc(busca)}" style="margin-top:6px">
    <div class="scroll"><table><thead><tr><th>Município</th><th ${ai('m1')}>Margem 1º</th><th ${ai('m2')}>Margem 2º</th><th ${ai('fatia')}>Δ fatia</th><th ${ai('swing')}>Swing</th><th ${ai('validos')}>Válidos 2º t.</th></tr></thead><tbody>
    ${lista.map(m => `<tr data-i="${m.uf}${m.tse}"><td>${esc(m.nome)}/${m.uf.toUpperCase()}${m.virada ? ' ⇄' : ''}</td><td class="${m.m1 > 0 ? 'L' : 'F'}">${pp(m.m1)}</td><td class="${m.m2 > 0 ? 'L' : 'F'}">${pp(m.m2)}</td><td>${m.ok ? pp(m.dsh) : '–'}</td><td>${pp(m.swing)}</td><td>${fmt(m.val2)}</td></tr>`).join('')}</tbody></table></div>
    <div class="note">⇄ = mudou o líder entre os turnos. Mostra até 80 linhas.</div>`;
  }

  function viewMun() {
    const m = selecionado; if (!m) return '<p>Clique em um município no mapa ou nas listas.</p>';
    const linhaT = (l, a, b, c) => `<tr><td>${l}</td><td>${a}</td><td>${b}</td><td>${c}</td></tr>`;
    return `<h3 style="margin-top:0">${esc(m.nome)}/${m.uf.toUpperCase()} <small>(IBGE ${m.ibge || '—'} · TSE ${m.tse})</small></h3>
    ${m.virada ? `<div class="warn" style="border-color:#b71c1c">Virou: ${m.virada === 'F>L' ? 'Flávio → Lula' : 'Lula → Flávio'}</div>` : ''}
    <table><thead><tr><th></th><th>1º turno</th><th>2º turno</th><th>Δ</th></tr></thead><tbody>
      ${linhaT('<span class="L">Lula</span>', fmt(m.L1) + ' (' + pc(m.L1 / m.val1 * 100) + ')', fmt(m.L2) + ' (' + pc(m.L2 / m.val2 * 100) + ')', fmt(m.L2 - m.L1))}
      ${linhaT('<span class="F">Flávio</span>', fmt(m.F1) + ' (' + pc(m.F1 / m.val1 * 100) + ')', fmt(m.F2) + ' (' + pc(m.F2 / m.val2 * 100) + ')', fmt(m.F2 - m.F1))}
      ${linhaT('Outros candidatos', fmt(m.O1), '–', fmt(-m.O1))}
      ${linhaT('Brancos + nulos', fmt(m.bn1), fmt(m.bn2), fmt(m.bn2 - m.bn1))}
      ${linhaT('Comparecimento', fmt(m.comp1), fmt(m.comp2), fmt(m.comp2 - m.comp1))}
      ${linhaT('Aptos', fmt(m.aptos), fmt(m.aptos), '')}
      ${linhaT(`<span ${ai('m12')}>Margem (L − F)</span>`, pp(m.m1), pp(m.m2), `<span ${ai('swing')}>${pp(m.swing)} (swing)</span>`)}
      ${m.ok ? linhaT(`<span ${ai('fatia')}>Fatia de Lula entre os finalistas</span>`, pc(m.L1 / (m.L1 + m.F1) * 100), pc(m.L2 / (m.L2 + m.F2) * 100), pp(m.dsh)) : ''}
    </tbody></table>${blocoDecomp(m)}`;
  }

  // ---------- Bairros e locais (resultado por seção agregado) ----------
  function agregaT(rows) {
    const out = LC.turnos.map(() => null);
    rows.forEach(r => LC.turnos.forEach((_, i) => { const t = r[8 + i]; if (!t) return; const o = (out[i] ??= [0, 0, 0, 0, 0, 0]); t.forEach((v, j) => { o[j] += v; }); }));
    return out;
  }
  const clsMg = t => { const v = mg(t); return v == null ? '' : v > 0 ? 'L' : 'F'; };
  let bairrosAtuais = [];
  function viewBairros() {
    const m = selecionado; if (!m) return '<p>Selecione um município (no mapa, nos rankings ou nas viradas) para ver os bairros.</p>';
    const ids = porMunBairro.get(m.uf + m.tse) ?? [], gr = new Map();
    ids.forEach(i => { const b = LC.linhas[i][7]; (gr.get(b) ?? gr.set(b, []).get(b)).push(i); });
    bairrosAtuais = [...gr].map(([b, is]) => { const ag = agregaT(is.map(i => LC.linhas[i])); return { is, nome: b >= 0 ? LC.bairros[b].split('|')[2] : '(sem cadastro)', ag, apt: ag.find(x => x)?.[0] ?? 0 }; }).sort((a, b) => b.apt - a.apt);
    const cab = LC.turnos.map(n => `<th>Margem ${n}º</th>`).join('') + (temT2 ? '<th>Swing</th>' : '');
    const lin = bairrosAtuais.map((g, k) => `<tr data-bi="${k}"><td>${esc(g.nome)}</td><td>${g.is.length}</td><td>${fmt(g.apt)}</td>${g.ag.map(t => `<td class="${clsMg(t)}">${t ? pp(mg(t)) : '–'}</td>`).join('')}${temT2 ? `<td>${g.ag[0] && g.ag[1] ? pp(mg(g.ag[1]) - mg(g.ag[0])) : '–'}</td>` : ''}</tr>`).join('');
    return `<h3 style="margin-top:0">Bairros de ${esc(m.nome)}/${m.uf.toUpperCase()}</h3>
    <div class="scroll"><table><thead><tr><th>Bairro</th><th>Locais</th><th>Aptos</th>${cab}</tr></thead><tbody>${lin}</tbody></table></div>
    <div class="note">Bairro conforme o cadastro do local de votação no TSE (o eleitor pode morar em outro bairro). Margem = Lula − Flávio, em p.p. dos votos válidos. ${temT2 ? '' : 'O 2º turno por seção ainda não foi publicado pelo TSE, então não há swing por bairro.'}</div>`;
  }
  function viewLocal() {
    if (selLocal < 0) return '<p>Ative “Locais de votação”, aproxime o mapa e clique em um ponto, ou escolha um bairro.</p>';
    const r = LC.linhas[selLocal], m = munDe(r), nb = r[7] >= 0 ? LC.bairros[r[7]].split('|')[2] : '–', cols = LC.turnos.map((_, i) => r[8 + i]);
    const val = t => t[2] + t[3] + t[4], pv = (t, x) => val(t) ? pc(x / val(t) * 100) : '–';
    const linha = (rot, f) => `<tr><td>${rot}</td>${cols.map(t => `<td>${t ? f(t) : '–'}</td>`).join('')}</tr>`;
    const ag = r[7] >= 0 && m ? agregaT((porMunBairro.get(m.uf + m.tse) ?? []).filter(i => LC.linhas[i][7] === r[7]).map(i => LC.linhas[i])) : [];
    return `<h3 style="margin-top:0">${esc(r[6])}</h3>
    <div class="note" style="margin-top:0">${esc(m ? m.nome : '')}/${r[0]} · zona ${r[2]} · local ${r[3]} · bairro: ${esc(nb)}${r[4] == null ? ' · sem coordenada válida no cadastro' : ''}</div>
    <table><thead><tr><th></th>${LC.turnos.map(n => `<th>${n}º turno</th>`).join('')}</tr></thead><tbody>
      ${linha('Aptos', t => fmt(t[0]))}
      ${linha('Comparecimento', t => `${fmt(t[1])} (abst. ${t[0] ? pc((1 - t[1] / t[0]) * 100) : '–'})`)}
      ${linha('<span class="L">Lula</span>', t => `${fmt(t[2])} (${pv(t, t[2])})`)}
      ${linha('<span class="F">Flávio</span>', t => `${fmt(t[3])} (${pv(t, t[3])})`)}
      ${linha('Outros candidatos', t => fmt(t[4]))}
      ${linha('Brancos + nulos', t => fmt(t[5]))}
      ${linha('Margem (L − F)', t => pp(mg(t)))}
    </tbody></table>
    ${ag.length ? `<div class="note">Bairro inteiro: ${LC.turnos.map((n, i) => `${n}º t. ${ag[i] ? txtMg(ag[i]) : '–'}`).join(' · ')}${m ? ` · Município: ${LC.turnos.map((n) => { const v = n === 1 ? m.m1 : m.m2; return `${n}º t. ${lado(v)} ${pp(Math.abs(v))}`; }).join(' · ')}` : ''}</div>` : ''}
    <div class="note">Coordenadas do cadastro de locais do TSE (podem ter imprecisão). Aptos = eleitores da seção; não há dados individuais.</div>`;
  }

  // ---------- Análise de um estado ----------
  let rankUF = 'viradas';
  const rankUFs = {
    viradas: ['Municípios que viraram (por votos válidos)', ms => ms.filter(m => m.virada).sort((a, b) => b.val2 - a.val2)],
    fatiaL: ['Maior Δ fatia de Lula (≥ 2 mil válidos)', ms => ms.filter(m => m.ok && m.val2 >= 2000).sort((a, b) => b.dsh - a.dsh)],
    fatiaF: ['Menor Δ fatia de Lula, pró-Flávio (≥ 2 mil válidos)', ms => ms.filter(m => m.ok && m.val2 >= 2000).sort((a, b) => a.dsh - b.dsh)],
    apertadas: ['Mais apertados no 2º turno (≥ 2 mil válidos)', ms => ms.filter(m => m.val2 >= 2000).sort((a, b) => Math.abs(a.m2) - Math.abs(b.m2))],
    maiores: ['Maiores municípios (votos válidos)', ms => [...ms].sort((a, b) => b.val2 - a.val2)],
  };
  function viewEstado() {
    if (!filtroAtivo()) return '<p>Escolha uma região, um estado, as capitais ou um tamanho de município nos seletores acima do mapa (ou clique em uma linha das abas Regiões e UFs e Recortes) para analisar o recorte.</p>';
    const uf = ufSel, ms = M.filter(noEscopo), t = ms.length ? tot(ms) : null, nac = tot(M), v = ms.filter(m => m.virada);
    if (!t) return '<p>Nenhum município neste recorte. Mude os filtros acima do mapa.</p>';
    const partes = [uf ? (UFNOME[uf] ?? uf.toUpperCase()) : regSel ? `Região ${regSel}` : 'Brasil', capSel === 'capitais' ? 'só capitais' : capSel === 'interior' ? 'sem capitais' : '', tamSel ? FAIXAS.find(f => f[0] === tamSel)[1].toLowerCase() : ''].filter(Boolean);
    const nomeEscopo = partes.join(' · ');
    const lista = rankUFs[rankUF][1](ms).slice(0, 60);
    const ufsRegiao = !uf && regSel ? P.ufs.filter(u => u.regiao === regSel) : [];
    return `<h3 style="margin-top:0">${esc(nomeEscopo)} <small>(${ms.length.toLocaleString('pt-BR')} ${uf === 'zz' || regSel === 'Exterior' ? 'localidades' : 'municípios'}${uf ? ` · Região ${esc(REGIAO_DE[uf] ?? '')}` : ''})</small></h3>
    <div class="kpis">
      <div class="kpi"><b class="L">${pc(t.L2 / t.val2 * 100, 2)}</b><span>Lula 2º t. (${mi(t.L2)})</span></div>
      <div class="kpi"><b class="F">${pc(t.F2 / t.val2 * 100, 2)}</b><span>Flávio 2º t. (${mi(t.F2)})</span></div>
      <div class="kpi" ${ai('fatia')}><b>${pp(t.dfatia, 2)}</b><span>Δ fatia de Lula (Brasil: ${pp(nac.dfatia, 2)}; swing da margem: ${pp(t.swing, 2)})</span></div>
      <div class="kpi" ${ai('virada')}><b>${v.length}</b><span>municípios viraram (${v.filter(x => x.virada === 'F>L').length} p/ Lula, ${v.filter(x => x.virada === 'L>F').length} p/ Flávio)</span></div>
      <div class="kpi" ${ai('abst')}><b>${pc((1 - t.comp1 / t.aptos) * 100,1)} → ${pc((1 - t.comp2 / t.aptos) * 100, 1)}</b><span>abstenção (Brasil: ${pc((1 - nac.comp1 / nac.aptos) * 100, 1)} → ${pc((1 - nac.comp2 / nac.aptos) * 100, 1)})</span></div>
      <div class="kpi" ${ai('m12')}><b class="${t.m1 > 0 ? 'L' : 'F'}">${pp(t.m1)} → ${pp(t.m2)}</b><span>margem 1º → 2º turno (L − F)</span></div>
      ${kpiSwing(ms)}
    </div>
    ${blocoTurnos(t)}
    ${blocoFaixas(ms)}
    ${blocoDecomp(t)}
    ${ufsRegiao.length ? `<h3>Estados da região <small>(clique para analisar)</small></h3>${tabelaGrupo(ufsRegiao, 'UF', 'uf')}` : ''}
    <h3>Municípios</h3>
    <select id="selRankUF">${Object.entries(rankUFs).map(([k, r]) => `<option value="${k}" ${k === rankUF ? 'selected' : ''}>${r[0]}</option>`).join('')}</select>
    <div class="scroll" style="margin-top:6px"><table><thead><tr><th>Município</th><th ${ai('m1')}>Margem 1º</th><th ${ai('m2')}>Margem 2º</th><th ${ai('fatia')}>Δ fatia</th><th ${ai('swing')}>Swing</th><th ${ai('validos')}>Válidos 2º t.</th></tr></thead><tbody>
    ${lista.map(m => `<tr data-i="${m.uf}${m.tse}"><td>${esc(m.nome)}${uf ? '' : '/' + m.uf.toUpperCase()}${m.virada ? ' ⇄' : ''}</td><td class="${m.m1 > 0 ? 'L' : 'F'}">${pp(m.m1)}</td><td class="${m.m2 > 0 ? 'L' : 'F'}">${pp(m.m2)}</td><td>${m.ok ? pp(m.dsh) : '–'}</td><td>${pp(m.swing)}</td><td>${fmt(m.val2)}</td></tr>`).join('') || '<tr><td colspan="6">Nenhum município nesta lista.</td></tr>'}</tbody></table></div>
    <div class="note">⇄ = mudou o líder entre os turnos. Mostra até 60 linhas. Clique em um município para ver o detalhe.</div>`;
  }

  function selecionar(m) { if (!noGeo(m)) setUF(m.uf); selecionado = m; aba = 'mun'; render(); pintar(); zoomMun(m); }

  function render() {
    [...ab.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.k === aba));
    pn.innerHTML = ({ brasil: viewBrasil, estado: viewEstado, regioes: viewRegioes, recortes: viewRecortes, ranking: viewRanking, mun: viewMun, bairros: () => viewBairros(), local: () => viewLocal() })[aba]() +
      '<div class="warn">Dados do portal do TSE; podem estar desatualizados ou conter erros. Para reporte, precificação ou decisão, conferir na fonte oficial (resultados.tse.jus.br).</div>';
    pn.querySelectorAll('th[data-o]').forEach(th => th.onclick = () => { const o = th.dataset.o; ordDir = ordUF === o ? -ordDir : -1; ordUF = o; render(); });
    pn.querySelectorAll('tr[data-uf]').forEach(tr => tr.onclick = () => setUF(tr.dataset.uf));
    pn.querySelectorAll('tr[data-reg]').forEach(tr => tr.onclick = () => setRegiao(tr.dataset.reg));
    pn.querySelectorAll('tr[data-cap]').forEach(tr => tr.onclick = () => { capSel = capSel === tr.dataset.cap ? '' : tr.dataset.cap; selCap.value = capSel; aplicarEscopo(); });
    pn.querySelectorAll('tr[data-tam]').forEach(tr => tr.onclick = () => { tamSel = tamSel === tr.dataset.tam ? '' : tr.dataset.tam; selTam.value = tamSel; aplicarEscopo(); });
    const sr = pn.querySelector('#selRankUF'); if (sr) sr.onchange = () => { rankUF = sr.value; render(); };
    pn.querySelectorAll('tr[data-bi]').forEach(tr => tr.onclick = () => zoomIndices(bairrosAtuais[+tr.dataset.bi].is));
    pn.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => selecionar(M.find(m => m.uf + m.tse === tr.dataset.i)));
    const s = pn.querySelector('#selRank'); if (s) s.onchange = () => { rank = s.value; render(); };
    const b = pn.querySelector('#busca'); if (b) b.oninput = () => { busca = b.value; const pos = b.selectionStart; render(); const nb = pn.querySelector('#busca'); nb.focus(); nb.setSelectionRange(pos, pos); };
  }
  // Tooltip de ajuda (ⓘ): passar o mouse (ou tocar) em qualquer elemento com data-info mostra a explicação do cálculo
  const aj = document.getElementById('ajuda');
  const posAjuda = (x, y) => { aj.style.left = Math.max(8, Math.min(x + 14, innerWidth - aj.offsetWidth - 8)) + 'px'; aj.style.top = (y + 18 + aj.offsetHeight > innerHeight ? Math.max(8, y - aj.offsetHeight - 12) : y + 18) + 'px'; };
  let ocultar;
  const mostrarAjuda = (el, x, y) => { clearTimeout(ocultar); aj.textContent = el.dataset.info; aj.style.display = 'block'; posAjuda(x, y); };
  document.addEventListener('mouseover', e => { const el = e.target.closest?.('[data-info]'); if (el) mostrarAjuda(el, e.clientX, e.clientY); else aj.style.display = 'none'; });
  document.addEventListener('mousemove', e => { if (aj.style.display === 'block') posAjuda(e.clientX, e.clientY); });
  document.addEventListener('click', e => { const el = e.target.closest?.('[data-info]'); if (el && matchMedia('(hover: none)').matches) { mostrarAjuda(el, e.clientX, e.clientY); ocultar = setTimeout(() => { aj.style.display = 'none'; }, 6000); } });
  pintar(); render();
})();
</script>
</body>
</html>
